[project]
name = "backend"
version = "0.1.0"
description = "Bangla product Q&A backend: FastAPI, SQL retrieval, optional Groq answers"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.135.1",
    "groq>=0.13",
    "pydantic-settings>=2.0",
    "sse-starlette>=3.3.2",
    "uvicorn[standard]>=0.42.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.setuptools]
py-modules = [
    "answering",
    "config",
    "context",
    "database",
    "llm",
    "main",
    "models",
    "retrieval",
    "security",
    "session",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
